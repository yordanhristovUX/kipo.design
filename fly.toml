# Fly.io deploy config for kipo.design.
# One machine runs the Node process (API + static SPA); a persistent volume is
# mounted at /data for the SQLite database and uploaded images.
#
# Secrets are NOT stored here — set them with `fly secrets set` (see DEPLOY.md):
#   ADMIN_EMAIL, ADMIN_PASSWORD_HASH, SESSION_SECRET, ALLOWED_ORIGINS

app = "kipo-design"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"
  DB_PATH = "/data/kipo.db"
  UPLOAD_DIR = "/data/uploads"

# Persistent volume — create once with:
#   fly volumes create kipo_data --size 1 --region ams
[[mounts]]
  source = "kipo_data"
  destination = "/data"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
